# Mini4WD Manual SDK — Language Policy
# Version: 2.4.1
# Bootstrap: Read AI_ENTRYPOINT.md first — language rules are part of the Bootstrap Contract
# Reference: Core/TEXT_ENGINE.md, Core/AI_OPERATING_RULES.md §TEXT RENDERING RULES
# Enforced by: Tests/TextValidation.md, PromptEngine/ (LOAD sequence)
#
# v2.4.1 — SCOPE CLARIFICATION (UAT-001):
# The Italian-only rule applies to EDITORIAL CONTENT — the text a reader sees on
# the manual pages. It does NOT apply to:
#   - technical terms with no Italian equivalent      → §exceptions.technical_terms
#   - commercial paint/product names                  → §exceptions.commercial_names
#   - manufacturer paint codes (TS-37, XF-1, X-10…)   → §exceptions.paint_codes
#   - YAML keys and schema values (finish: gloss)     → §exceptions.yaml_schema
#   - structural/metadata terms (Header, Footer, draft, locked)
#                                                     → §exceptions.structural_metadata
# A validator MUST NOT flag those categories as language violations.

language_policy:
  version: "2.4.1"

  # ============================================================
  # PRIMARY LANGUAGE
  # ============================================================
  primary: "it"                    # Italian — mandatory, non-overridable
  display_name: "Italiano"

  # ============================================================
  # ALLOWED LANGUAGES
  # ============================================================
  allowed:
    - "it"                         # Italian only

  # ============================================================
  # FORBIDDEN LANGUAGES (zero tolerance)
  # ============================================================
  forbidden:
    - code: "ja"
      name: "Japanese"
      scripts: ["kanji", "hiragana", "katakana", "romaji"]
      reason: "Japanese text will never appear in Italian manuals, even as decoration"
    - code: "en"
      name: "English"
      reason: "English sentences/headings forbidden in editorial body text. Does NOT apply to §exceptions: technical terms, commercial names, paint codes, YAML keys, metadata. Italian equivalents: Knowledge/GlossaryIT.md"
    - code: "fr"
      name: "French"
    - code: "de"
      name: "German"
    - code: "es"
      name: "Spanish"
    - code: "zh"
      name: "Chinese"
      scripts: ["simplified", "traditional"]
    - code: "ko"
      name: "Korean"
      scripts: ["hangul"]
    - code: "ar"
      name: "Arabic"
    - code: "ru"
      name: "Russian"

  # ============================================================
  # RENDERING RULES
  # ============================================================
  rendering:
    never_mix_languages: true
    never_fake_text: true              # No random or invented text
    never_placeholder_lorem: true      # No "Lorem ipsum"
    never_simulate_japanese: true      # No pseudo-kanji, no Japanese-style decoration
    never_simulate_asian_scripts: true # No CJK characters of any kind
    all_text_must_be_italian: true
    headings_only_italian: true
    body_only_italian: true
    callouts_only_italian: true
    notes_only_italian: true
    warnings_only_italian: true
    footnotes_only_italian: true
    labels_only_italian: true
    button_text_only_italian: true
    unit_labels_italian: true          # "minuti" not "minutes"; "cm" OK (universal)

  # ============================================================
  # APPROVED PLACEHOLDERS
  # ============================================================
  # When content is missing or uncertain, use these — never invent
  approved_placeholders:
    title: "[TITOLO]"
    subtitle: "[SOTTOTITOLO]"
    body_text: "[TESTO]"
    step_description: "[DESCRIZIONE PASSO]"
    warning_text: "[AVVERTENZA]"
    tip_text: "[SUGGERIMENTO]"
    note_text: "[NOTA]"
    color_name: "[NOME COLORE]"
    material_name: "[NOME MATERIALE]"
    unknown_value: "[VALORE NON SPECIFICATO]"

  # ============================================================
  # TYPOGRAPHY
  # ============================================================
  typography:
    sentence_case_body: true           # Normal sentence casing in body
    title_case_h1: true                # First letter uppercase for main titles
    uppercase_labels: true             # Component labels (P001, C001) in caps
    no_all_caps_body: true             # Never all-caps in body text
    decimal_separator: ","             # Italian: virgola (1,5 not 1.5)
    thousand_separator: "."            # Italian: punto (1.000 not 1,000)
    quote_style: "«»"                  # Italian guillemets, not "quotation marks"

  # ============================================================
  # TECHNICAL TERMS
  # ============================================================
  technical_terms:
    use_italian_where_available: true
    accept_untranslatable_english: true    # "airbrush", "spray" — no Italian equivalent
    reference: "Knowledge/GlossaryIT.md"
    forbidden_reference: "Knowledge/ForbiddenWords.md"
    require_consistency: true              # Same term used consistently across all pages

  # ============================================================
  # EXCEPTIONS (language-neutral elements)
  # ============================================================
  # v2.4.1: expanded into explicit categories. Everything below is
  # language-neutral and MUST NOT be reported as a language violation
  # by any validation suite.
  exceptions:
    # --- Manufacturer product codes (never translated) ---
    paint_codes: "language-neutral"        # TS-57, TS-37, PS-1, XF-1, X-10, X-11, C-5, 72.001, etc.
    numeric_values: "language-neutral"
    component_ids: "language-neutral"      # C001, P001, PC001, M001, D001, DEC001
    code_blocks: "language-neutral"        # SDK internals in fenced blocks
    unit_symbols: "language-neutral"       # cm, mm, g, ml

    # --- Technical terms without an established Italian equivalent ---
    # Used inside Italian sentences; kept as-is (see §technical_terms).
    technical_terms: "language-neutral"
    technical_terms_whitelist:
      - "Primer"
      - "Topcoat"
      - "Clear coat"
      - "Masking Tape"
      - "Spray"
      - "Airbrush"
      - "Decal"

    # --- Commercial names (paints, finishes, products) ---
    # Official manufacturer color/product names are proper nouns:
    # never translated, never flagged.
    commercial_names: "language-neutral"
    commercial_names_examples:
      - "Chrome Silver"
      - "Gun Metal"
      - "Semi Gloss Black"
      - "Flat Black"
      - "Metallic Purple"
      - "Tamiya Surface Primer"

    # --- YAML keys and schema values ---
    # Structural keys (title:, subtitle:, footer:) and enumerated schema
    # values (finish: gloss|matte|metallic, technique: spray-can) are part
    # of the file format, not editorial content. English here is CORRECT.
    # The Italian rendering of these values ("Lucido", "Opaco") belongs to
    # the editorial fields that the Text Engine generates from them.
    yaml_schema: "language-neutral"

    # --- Structural / metadata terms ---
    # Component names (Header, Footer), lifecycle states (draft, review,
    # approved, locked, rendered, released, archived) and QA statuses are
    # metadata, not page text. Never flagged when used as metadata.
    structural_metadata: "language-neutral"
    structural_metadata_examples:
      - "Header"
      - "Footer"
      - "draft"
      - "locked"
      - "PASS"
      - "FAIL"

  # ============================================================
  # SCOPE OF VALIDATION (v2.4.1)
  # ============================================================
  # What the language validator checks, and against what:
  validation_scope:
    editorial_content: "italian-only"      # titles, subtitles, step text, callouts, captions
    metadata_and_keys: "not-validated"     # YAML keys, schema values, lifecycle states
    proper_nouns: "not-validated"          # model names, paint names, brand names
    templates: "not-validated"             # files with status: draft and empty/placeholder fields
                                           # are templates — see Tests/ContentValidation.md
                                           # §Validation Scope
