# ─────────────────────────────────────────────
# APPROVEDASSETS/ — CMS layer (NEW v2.4.0, REMOVED v2.5.0)
# ─────────────────────────────────────────────

approved_assets:
  description: "CMS layer — sealed content modules per page. Was a single global directory shared by all projects; removed in v2.5.0, superseded by a per-project-variant directory (see page_modules below)."
  added_in: "2.4.0"
  removed_in: "2.5.0"
  status: "removed"

  page_modules:
    structure: "Projects/{Model}/{Variant}/ApprovedText/P00x/"
    files_per_module:
      - "content.yaml    ← PRIMARY source of truth"
      - "text.md         ← derived from content.yaml, read-only after approval"
      - "metadata.yaml   ← lifecycle state (draft/review/approved/locked/rendered/released/archived)"
      - "manifest.yaml   ← components, images, tokens, prompt_file, dependencies"
      - "changelog.md    ← revision history"
      - "notes.md        ← editorial annotations, not rendered"
      - "README.md       ← module documentation"
    pages: ["P001", "P002", "P003", "P004", "P005", "P006", "P007", "P008", "P009", "P010"]

