# ============================================================
# PAINT SCHEME: Cotton Candy Drift
# ============================================================
paintScheme:
  name: "Cotton Candy Drift"
  slug: "cotton-candy-drift"
  description: "Schema pastello allegro e giocoso: azzurro cielo come colore dominante della carrozzeria, abbinato a pannelli rosa confetto per un contrasto dolce. Accenti in nero lucido definiscono le linee della carrozzeria, mentre tocchi di giallo acceso ravvivano i dettagli in minoranza. Argento e gun metal metallizzati valorizzano telaio e componenti meccanici del motore per un tocco racing."
  colors:
    - id: "PC001"
      name: "Body Base"
      paintBrand: "Tamiya"
      paintCode: "TS-23"
      paintName: "Light Blue"
      hex: "#8FD3E8"
      finish: "gloss"
      coverage: "3 mani sottili"
      notes: "Colore dominante dello schema. Applicare su primer bianco per mantenere la luminosità pastello. Distanza 25-30cm."

    - id: "PC002"
      name: "Cowling Accents & Side Panels"
      paintBrand: "Tamiya"
      paintCode: "TS-25"
      paintName: "Pink"
      hex: "#F4879E"
      finish: "gloss"
      coverage: "2-3 mani sottili"
      notes: "Applicare dopo mascheratura del corpo principale già in Light Blue. Su primer bianco per massima brillantezza."

    - id: "PC003"
      name: "Trim & Accent Lines"
      paintBrand: "Tamiya"
      paintCode: "TS-14"
      paintName: "Black"
      hex: "#0A0A0A"
      finish: "gloss"
      coverage: "2 mani"
      notes: "Colore di accento — linee di cintura, cornici, abitacolo. Non colore dominante."

    - id: "PC004"
      name: "Highlight Accents"
      paintBrand: "Tamiya"
      paintCode: "TS-16"
      paintName: "Yellow"
      hex: "#F5D300"
      finish: "gloss"
      coverage: "1-2 mani"
      notes: "Colore di accento minoritario — piccoli dettagli e punti luce. Coprente già in 2 mani su base chiara."

    - id: "PC005"
      name: "Chassis & Motor Cover"
      paintBrand: "Tamiya"
      paintCode: "TS-30"
      paintName: "Silver Leaf"
      hex: "#C8C8C8"
      finish: "metallic"
      coverage: "2 mani"
      notes: "Metallizzato — applicare sempre nella stessa direzione per uniformità. Usato su telaio e cover motore."

    - id: "PC006"
      name: "External Mechanical Details"
      paintBrand: "Tamiya"
      paintCode: "TS-38"
      paintName: "Gun Metal"
      hex: "#4B4E52"
      finish: "metallic"
      coverage: "1-2 mani"
      notes: "Metallizzato scuro per la cover ingranaggi esterna e altri dettagli meccanici cosmetici — MAI su ingranaggi, boccole o meccanica interna del motore (parti mobili/funzionali, vedi Knowledge/MechanicalSafety.md). Ideale a pennello con tecnica dry-brush."

  colorNotes: "Usare esclusivamente vernici Tamiya TS in spray a 20-25°C. Data la natura pastello dello schema, applicare sempre Primer Bianco Tamiya prima dei colori PC001/PC002/PC004 — un primer grigio scurirebbe eccessivamente la resa. Finitura consigliata: TS-13 Clear (lucido) su tutta la carrozzeria, 24 ore dopo l'ultima mano colore. I metallizzati (PC005/PC006) non richiedono clear coat."

# ============================================================
# MATERIALS
# ============================================================
materials:
  paints: []  # Derivato automaticamente da paintScheme.colors

  tools:
