      type: "airbrush"
      optional: true
      notes: "Alternativa al pennello per superfici grandi, in particolare per PC001/PC002."

    - name: "Pennello sintetico piatto n.8"
      type: "brush"
      optional: false
      notes: "Per aree medie e mascherature irregolari (PC003, PC004)."

    - name: "Pennello sintetico tondo n.000"
      type: "brush"
      optional: false
      notes: "Per dettagli fini: abitacolo, cover ingranaggi esterna, dry-brush metallizzati."

    - name: "Coltellino da modellismo"
      type: "tool"
      optional: false
      notes: "Per rifilare il nastro di mascheratura sulle curve della cowling."

    - name: "Bacchette in legno (stecchi)"
      type: "tool"
      optional: false
      notes: "Per tenere la carrozzeria durante la verniciatura senza toccarla."

  consumables:
    - name: "Carta abrasiva"
      type: "sandpaper"
      specification: "400 grit (primo passaggio), 600 grit (secondo), 1000 grit (finale)"
      optional: false

    - name: "Nastro di mascheratura Tamiya"
      type: "tape"
      specification: "6mm (curve), 10mm (linee rette), 18mm (aree ampie)"
      optional: false

    - name: "Diluente Tamiya X-20A"
      type: "thinner"
      specification: "Per aerografo e pulizia pennelli"
      optional: true

    - name: "Panno per rimozione polvere (tack cloth)"
      type: "cleaner"
      specification: "Privo di pelucchi"
      optional: false

    - name: "Primer bianco Tamiya (Fine Surface Primer)"
      type: "primer"
      specification: "Spray 180ml, base Bianca"
      optional: false
      notes: "Essenziale per mantenere la luminosità dei pastelli azzurro/rosa/giallo."

# ============================================================
# PREPARATION STEPS
# ============================================================
preparationSteps:
  - id: 1
    title: "Lavaggio della carrozzeria"
    description: "Lavare la carrozzeria in ABS con acqua tiepida e detergente neutro. Usare uno spazzolino morbido per rimuovere i residui di stampo. Risciacquare con acqua distillata."
    duration: "15 min"
    tools: ["spazzolino morbido"]
    warning: "Non usare detergenti aggressivi o solventi — danneggiano la plastica ABS."
    tip: "L'acqua distillata nel risciacquo finale evita depositi calcarei che comprometterebbero l'adesione del primer."

  - id: 2
    title: "Asciugatura completa"
    description: "Lasciare asciugare la carrozzeria all'aria per almeno 2 ore in ambiente pulito e privo di polvere."
    duration: "120 min"
    tools: []
    warning: "Non usare asciugacapelli — il calore deforma la plastica ABS sottile."
    tip: null

  - id: 3
    title: "Carteggiatura leggera"
    description: "Carteggiare delicatamente tutta la superficie con carta abrasiva 400 grit a umido, poi rifinire con 600 grit. Procedere in direzione unica, mai circolare."
    duration: "20 min"
    tools: ["Carta abrasiva 400 grit"]
    warning: "Non carteggiare eventuali scritte in rilievo o texture decorative."
    tip: "Una superficie ben opacizzata migliora sensibilmente l'adesione del primer bianco."

  - id: 4
    title: "Rimozione della polvere"
    description: "Eliminare tutta la polvere di carteggiatura con un panno tack cloth, passando su tutta la superficie con movimenti lenti."
    duration: "10 min"
    tools: ["Panno tack cloth"]
    warning: "Non soffiare sulla carrozzeria con la bocca — la saliva causa crateri nella vernice (fish-eye)."
    tip: "Lavorare in un ambiente con poca circolazione d'aria per evitare che la polvere si ridepositi."

  - id: 5
    title: "Applicazione del primer bianco"
    description: "Applicare il primer bianco Tamiya in 2 mani sottili, attendendo 10 minuti tra una mano e l'altra, a 25-30cm di distanza. Lasciare asciugare 2 ore prima di procedere."
    duration: "15 min (applicazione) + 120 min (asciugatura)"
    tools: ["Primer bianco Tamiya (Fine Surface Primer)"]
    warning: "Non applicare una sola mano spessa — causerebbe colature."
    tip: "Il primer bianco (anziché grigio) è fondamentale per la resa vivace dei pastelli azzurro, rosa e giallo di questo schema."

# ============================================================
# PAINT SEQUENCE
# ============================================================
paintSequence:
  - step: 1
    colorId: "PC005"
    area: "Telaio Super-II e cover motore"
    technique: "spray-can"
    coats: 2
    dryingTime: "30 min tra le mani, 2 ore prima di procedere"
    notes: "Iniziare dal telaio per evitare sovra-spray sulla carrozzeria."

  - step: 2
    colorId: "PC001"
    area: "Intera carrozzeria esterna (cowling completa)"
    technique: "spray-can"
    coats: 3
    dryingTime: "20 min tra le mani, 3 ore prima della mascheratura"
    notes: "Colore dominante. Prima mano di ancoraggio leggera, seconda e terza per copertura piena."

  - step: 3
    colorId: "PC002"
    area: "Ala posteriore e pannelli laterali della cowling"
    technique: "spray-can"
    coats: 2
    dryingTime: "30 min tra le mani, 2 ore prima di rimuovere la mascheratura"
    notes: "Applicare dopo mascheratura (M001) delle zone già in Light Blue."

  - step: 4
    colorId: "PC003"
    area: "Linee di cintura, cornice abitacolo, bordi cowling"
    technique: "brush"
    coats: 2
    dryingTime: "1 ora tra le mani, 2 ore prima del clear coat"
    notes: "Pennello piatto n.8 dopo mascheratura M002. Diluire leggermente per evitare pennellate visibili."

  - step: 5
    colorId: "PC004"
    area: "Dettagli in rilievo e piccoli accenti (numero di gara, prese d'aria)"
    technique: "brush"
    coats: 2
    dryingTime: "1 ora tra le mani"
    notes: "Colore minoritario: usare con parsimonia solo su piccoli dettagli per non competere con azzurro e rosa."

  - step: 6
    colorId: "PC006"
    area: "Cover ingranaggi esterna (guscio Super-II)"
    technique: "brush"
    coats: 1
    dryingTime: "2 ore prima dell'assemblaggio finale"
    notes: "Pennello tondo n.000, tecnica dry-brush per accentuare i rilievi meccanici. NON verniciare ingranaggi o meccanica interna del motore — comprometterebbe il funzionamento del modello."

# ============================================================
# MASKING
# ============================================================
maskingZones:
  - id: "M001"
    area: "Ala posteriore e pannelli laterali della cowling"
    maskingType: "tape"
    maskingOrder: 1
    notes: "Mascherare dopo completa asciugatura di PC001. Nastro 10mm per aree piane, 6mm per bordi curvi, in vista della verniciatura PC002."

  - id: "M002"
    area: "Linee di cintura e cornice abitacolo"
    maskingType: "tape"
    maskingOrder: 2
    notes: "Nastro 6mm per seguire le curve della cornice prima dell'accento nero PC003."

  - id: "M003"
    area: "Cerchi ruote (per verniciatura PC005)"
    maskingType: "tape"
    maskingOrder: 3
    notes: "Rimuovi le gomme dal cerchio (si sfilano a mano, sono removibili/intercambiabili — non vanno mascherate). Vernicia il cerchio a gomma smontata. Se la superficie di contatto cerchio-gomma rischia vernice, mascherala con un dischetto di nastro/carta per garantire corretto inserimento/rimozione della gomma dopo la verniciatura."

# ============================================================
# DETAILS
# ============================================================
detailAreas:
  - id: "D001"
    name: "Abitacolo / cornice interna"
    colorId: "PC003"
    technique: "Pennello piatto n.8, 2 mani"
    notes: "Nero come contrasto netto rispetto ad azzurro e rosa della cowling."

  - id: "D002"
    name: "Cover ingranaggi esterna (guscio Super-II)"
    colorId: "PC006"
    technique: "Pennello tondo n.000, dry-brush"
    notes: "Gun metal metallizzato per un effetto meccanico realistico sulla cover esterna del cambio. NON verniciare ingranaggi o meccanica interna del motore — comprometterebbe il funzionamento del modello (vedi Knowledge/MechanicalSafety.md)."

  - id: "D003"
    name: "Cerchi ruote"
    colorId: "PC005"
    technique: "Pennello tondo n.000 o spray dopo mascheratura M003"
    notes: "Argento metallizzato coordinato con il telaio Super-II."

  - id: "D004"
    name: "Piccoli dettagli e prese d'aria"
    colorId: "PC004"
    technique: "Pennello tondo n.000, tocco leggero"
    notes: "Giallo usato con parsimonia — solo accenti puntuali, mai aree estese."

