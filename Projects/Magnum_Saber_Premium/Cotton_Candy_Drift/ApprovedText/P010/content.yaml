# ============================================================
# CHECKLIST SECTIONS
# Items specifici per modello/schema (Core/PAGE_SYSTEM.md §P010 — "not generic")
# colorId (PC001-PC006) risolti contro paintScheme.colors — nessun TODO
# ============================================================
checklist_sections:
  - title: "Verniciatura"
    items:
      - "Verificare che la carrozzeria sia completamente asciutta"
      - "Verificare l'uniformità del colore su tutta la superficie, in particolare sull'azzurro Light Blue (TS-23) dominante"
      - "Verificare l'assenza di colature o difetti visibili a 30cm di distanza"
      - "Verificare che Light Blue (TS-23) sia applicato correttamente sulla carrozzeria esterna"
      - "Verificare che Pink (TS-25) sia applicato correttamente su ala posteriore e pannelli laterali della cowling"
      - "Verificare che Black (TS-14) sia applicato correttamente su linee di cintura, cornice abitacolo e bordi cowling"
      - "Verificare che Yellow (TS-16) sia applicato correttamente sui piccoli dettagli e prese d'aria"
      - "Verificare che Silver Leaf (TS-30) sia applicato correttamente su telaio Super-II e cover motore"
      - "Verificare che Gun Metal (TS-38) sia applicato correttamente su ingranaggi visibili, boccole e dettagli meccanici del motore"

  - title: "Mascheratura"
    items:
      - "Verificare che i bordi di mascheratura su ala posteriore e pannelli laterali (zona M001) siano netti, senza infiltrazioni di Pink sotto il Light Blue"
      - "Verificare che i bordi di mascheratura su linee di cintura e cornice abitacolo (zona M002) siano netti, senza infiltrazioni di Black"
      - "Verificare che i cerchi ruote (zona M003) non presentino residui di nastro dopo la verniciatura Silver Leaf"

  - title: "Decalcomanie"
    items:
      - "Questo schema non utilizza decalcomanie — nessuna verifica necessaria"

  - title: "Finitura"
    items:
      - "Verificare l'uniformità della vernice trasparente TS-13 (lucido) sulla carrozzeria"
      - "Verificare che i metallizzati (Silver Leaf e Gun Metal) non presentino clear coat applicato per errore — non è richiesto per queste finiture"
      - "Verificare che la finitura corrisponda allo schema Cotton Candy Drift previsto"

care_instructions:
  - "Non usare solventi o detergenti a base alcolica sulle superfici verniciate."
  - "Pulisci solo con un panno in microfibra asciutto o leggermente inumidito, privo di pelucchi."
  - "Evita l'esposizione prolungata alla luce solare diretta (i raggi UV causano viraggio del colore)."
  - "Conserva in una teca antipolvere quando non in uso."
  - "Non applicare etichette adesive direttamente sulle superfici verniciate."
  - "Maneggia dal telaio, non dalla carrozzeria, per evitare impronte digitali sulla vernice."

storage_notes: "Avvolgi in carta velina priva di acidi per la conservazione a lungo termine. Mantieni a temperatura ambiente (15-25°C). Evita ambienti con umidità elevata (oltre il 70% RH) per preservare l'integrità della vernice nel tempo."

completion_note: "Complimenti! Hai completato la verniciatura del tuo Magnum Saber Premium (Super-II Chassis) nello schema Cotton Candy Drift. Il tuo modello è pronto per il montaggio finale."

