# ============================================================
# TOOLS — from PROJECT.yaml materials.tools[]
# ============================================================
tools:
  - name: "Aerografo Tamiya 0.3mm"
    type: "aerografo"
    optional: true
    notes: "Alternativa al pennello per superfici grandi, in particolare per PC001/PC002."

  - name: "Pennello sintetico piatto n.8"
    type: "pennello"
    optional: false
    notes: "Per aree medie e mascherature irregolari (PC003, PC004)."

  - name: "Pennello sintetico tondo n.000"
    type: "pennello"
    optional: false
    notes: "Per dettagli fini: abitacolo, cover ingranaggi esterna, dry-brush metallizzati."

  - name: "Coltellino da modellismo"
    type: "strumento"
    optional: false
    notes: "Per rifilare il nastro di mascheratura sulle curve della cowling."

  - name: "Bacchette in legno (stecchi)"
    type: "strumento"
    optional: false
    notes: "Per tenere la carrozzeria durante la verniciatura senza toccarla."

# ============================================================
# CONSUMABLES — sandpaper, tape, thinner, etc.
# ============================================================
consumables:
  - name: "Carta abrasiva"
    specification: "400 grit (primo passaggio), 600 grit (secondo), 1000 grit (finale)"
    optional: false
    notes: ""

  - name: "Nastro di mascheratura Tamiya"
    specification: "6mm (curve), 10mm (linee rette), 18mm (aree ampie)"
    optional: false
    notes: ""

  - name: "Diluente Tamiya X-20A"
    specification: "Per aerografo e pulizia pennelli"
    optional: true
    notes: ""

  - name: "Panno per rimozione polvere (tack cloth)"
    specification: "Privo di pelucchi"
    optional: false
    notes: ""

  - name: "Primer bianco Tamiya (Fine Surface Primer)"
    specification: "Spray 180ml, base Bianca"
    optional: false
    notes: "Essenziale per mantenere la luminosità dei pastelli azzurro/rosa/giallo."

# ============================================================
# SAFETY NOTES — for C008 Warning boxes
# ============================================================
safety_notes:
  - "Attenzione: utilizzare sempre le vernici in un ambiente ben ventilato. Indossare guanti in nitrile quando si maneggiano vernici e diluenti a base solvente. Tenere lontano da fiamme libere. Leggere le schede di sicurezza dei prodotti prima dell'uso."

