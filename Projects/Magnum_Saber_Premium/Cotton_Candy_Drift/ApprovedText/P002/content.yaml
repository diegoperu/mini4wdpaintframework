  front:
    file: "Images/P002_front.png"   # paths.colorSchemeRenderFront — non ancora renderizzato (Phase 3 pending)
    alt: "Vista ortogonale frontale della carrozzeria Magnum Saber Premium, schema Cotton Candy Drift"
  side:
    file: "Images/P002_side.png"    # paths.colorSchemeRenderSide — non ancora renderizzato (Phase 3 pending)
    alt: "Vista ortogonale laterale destra della carrozzeria Magnum Saber Premium, schema Cotton Candy Drift"
  top:
    file: "Images/P002_top.png"     # paths.colorSchemeRenderTop — non ancora renderizzato (Phase 3 pending)
    alt: "Vista ortogonale dall'alto della carrozzeria Magnum Saber Premium, schema Cotton Candy Drift"

component_mapping:
  C001:
    uses: ["title"]
  C002:
    uses: ["footer.page_id", "footer.model_name"]
  C003:
    uses: ["colors[].name", "colors[].hex", "palette_overview"]
  C006:
    uses: ["color_notes"]
  C010:
    uses: ["colors[].name", "colors[].paint_code", "colors[].finish"]
  C011:
    uses: ["colors[].paint_code", "colors[].paint_brand", "colors[].finish", "colors[].name"]
