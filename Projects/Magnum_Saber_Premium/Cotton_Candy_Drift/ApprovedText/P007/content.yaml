  id: "P007"
  name: "Dettagli"
  version: "1.0.0"
  language: "it"

title: "Verniciatura dei Dettagli"  # REQUIRED
intro: ""                           # OPTIONAL — non richiesto da PromptEngine/Details.md

# ============================================================
# DETAIL AREAS — from PROJECT.yaml detailAreas[]
# color_id risolto contro paintScheme.colors[] (= P002 colors[].id) — nessun TODO
# ============================================================
areas:
  - id: "D001"
    name: "Abitacolo / cornice interna"
    color_id: "PC003"        # → TS-14 Black, Lucido
    technique: "pennello"
    description: "Dipingi l'abitacolo e la cornice interna con pennello piatto n.8, applicando 2 mani di TS-14 (Black)."
    notes: "Nero come contrasto netto rispetto ad azzurro e rosa della cowling."

  - id: "D002"
    name: "Cover ingranaggi esterna (guscio Super-II)"
    color_id: "PC006"        # → TS-38 Gun Metal, Metallizzato
    technique: "pennello"
    description: "Applica TS-38 (Gun Metal) sulla cover esterna del cambio con pennello tondo n.000, usando la tecnica dry-brush."
    notes: "Gun metal metallizzato per un effetto meccanico realistico sulla cover esterna. NON verniciare ingranaggi o meccanica interna del motore — comprometterebbe il funzionamento del modello (vedi Knowledge/MechanicalSafety.md)."

  - id: "D003"
    name: "Cerchi ruote"
    color_id: "PC005"        # → TS-30 Silver Leaf, Metallizzato
    technique: "pennello"
    description: "Applica TS-30 (Silver Leaf) sui cerchi ruote con pennello tondo n.000, oppure a spray dopo la mascheratura M003."
    notes: "Argento metallizzato coordinato con il telaio Super-II."

  - id: "D004"
    name: "Piccoli dettagli e prese d'aria"
    color_id: "PC004"        # → TS-16 Yellow, Lucido
    technique: "pennello"
    description: "Applica TS-16 (Yellow) su piccoli dettagli e prese d'aria con pennello tondo n.000 e tocco leggero."
    notes: "Giallo usato con parsimonia — solo accenti puntuali, mai aree estese."

warnings: []                 # C008 — nessun warning specifico in PROJECT.yaml/PromptEngine/Details.md per questa pagina

tips:
  - "Suggerimento: diluisci la vernice. Le vernici per dettagli devono scorrere liberamente da un pennello n.000 senza formare grumi. Mescola 1 parte di vernice con 1 parte di diluente appropriato."
  - "Suggerimento: asciuga il pennello. Rimuovi la vernice in eccesso su un foglio di carta assorbente prima di ogni pennellata. Il pennello deve apparire quasi asciutto — questa è la tecnica dry-brush."
  - "Suggerimento: chiaro sopra scuro. Applica sempre i colori chiari sopra quelli scuri. Se sbagli un colore chiaro sopra uno scuro, dovrai prima riverniciare la base scura."
  - "Suggerimento: stabilizza la mano. Appoggia il polso della mano che dipinge su una superficie stabile. Non dipingere mai a mano libera in aria per lavori di dettaglio."
  - "Suggerimento: usa un ingrandimento. Usa una lente 10x o una lente d'ingrandimento per ispezionare il lavoro. Errori invisibili a occhio nudo appariranno nelle fotografie."

