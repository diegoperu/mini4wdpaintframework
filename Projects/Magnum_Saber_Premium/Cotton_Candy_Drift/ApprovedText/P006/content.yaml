# Mini4WD Manual SDK — Page Content
# Page: P006 — Mascheratura (Masking)
# SDK Version: 2.4.0
# SOURCE OF TRUTH

page:
  id: "P006"
  name: "Mascheratura"
  version: "1.0.0"
  language: "it"

title: "Guida alla Mascheratura"  # REQUIRED
intro: ""                         # OPTIONAL — non richiesto da PromptEngine/Masking.md

# ============================================================
# ZONES — from PROJECT.yaml maskingZones[]
# colorId (PC00x) menzionati nelle note risolti contro paintScheme.colors — nessun TODO
# ============================================================
zones:
  - id: "M001"
    area: "Ala posteriore e pannelli laterali della cowling"
    masking_type: "nastro"    # tape → nastro
    order: 1
    notes: "Mascherare dopo completa asciugatura di PC001 (Light Blue). Nastro 10mm per aree piane, 6mm per bordi curvi, in vista della verniciatura PC002 (Pink)."

  - id: "M002"
    area: "Linee di cintura e cornice abitacolo"
    masking_type: "nastro"
    order: 2
    notes: "Nastro 6mm per seguire le curve della cornice prima dell'accento nero PC003 (Black)."

  - id: "M003"
    area: "Cerchi ruote (per verniciatura PC005 — Silver Leaf)"
    masking_type: "nastro"
    order: 3
    notes: "Rimuovi le gomme dal cerchio (si sfilano a mano, sono removibili/intercambiabili — non vanno mascherate). Vernicia il cerchio a gomma smontata. Se la superficie di contatto cerchio-gomma rischia vernice, mascherala con un dischetto di nastro/carta per garantire corretto inserimento/rimozione della gomma dopo la verniciatura."

# ============================================================
# MASKING SEQUENCE — ordered steps
# ============================================================
sequence:
  - step: 1
    description: "Applica il nastro di mascheratura sull'ala posteriore e sui pannelli laterali della cowling: usa nastro 10mm per le aree piane e 6mm per i bordi curvi. Procedi solo dopo la completa asciugatura di PC001 (Light Blue), in vista della verniciatura PC002 (Pink)."
    zone_id: "M001"
    tip: ""

  - step: 2
    description: "Applica il nastro da 6mm lungo le linee di cintura e la cornice dell'abitacolo, seguendo le curve, prima di applicare l'accento nero PC003 (Black)."
    zone_id: "M002"
    tip: ""

  - step: 3
    description: "Rimuovi le gomme dal cerchio (si sfilano a mano) prima di verniciare in PC005 (Silver Leaf). Se necessario, proteggi la sola superficie di contatto cerchio-gomma con un dischetto di nastro/carta."
    zone_id: "M003"
    tip: ""

warnings:
  - "Attenzione: premi i bordi del nastro con decisione usando uno stuzzicadenti o uno strumento brunitore. Rimuovi il nastro a 45 gradi, allontanandolo dal bordo della vernice, subito dopo la verniciatura, mentre la vernice è ancora leggermente umida. Non lasciare mai il nastro di mascheratura su superfici verniciate per più di 24 ore."

tips: []                     # C009 — nessun dato distinto in PROJECT.yaml/PromptEngine/Masking.md

callouts:
  - title: "Tipi di Nastro"
    body: "Nastro di mascheratura standard (18mm): per bordi dritti e aree piane. Nastro washi a bassa adesività (6mm): per curve e superfici già verniciate delicate. Vernice liquida mascherante: per forme irregolari e aree complesse. Maschere pretagliate: per finestrini e forme geometriche precise."

footer:
  page_id: "P006"
  model_name: "Magnum Saber Premium (Super-II Chassis)"
  series: "Fully Cowled Mini 4WD Series No.31 — Item No. 19431"

