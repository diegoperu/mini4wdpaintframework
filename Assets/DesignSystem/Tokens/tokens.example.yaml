# Mini4WD Manual SDK — Design Tokens (Example / SDK Default)
# Version: 2.5.5
# Reference: Core/STYLE_GUIDE.md, Core/COMPONENT_SYSTEM.md
# Schema: tokens.schema.yaml
#
# This file is the SDK default token set.
# To customize for a project, copy to Projects/{ModelName}/tokens.override.yaml
# and override only the values that differ from these defaults.
#
# Token reference syntax in prompts: {{token.TokenName}}
# Example: "Background color: {{token.TamiyaPrimary}}"

tokens:

  # ============================================================
  # COLOR TOKENS
  # ============================================================
  # Colors are organized into semantic groups.
  # Never reference a hex value directly in a prompt — always use a token.
  # ============================================================

  colors:

    primary:
      # The SDK's defining color. Used for header bands, side panels, and all
      # primary brand elements. Must appear on every page. Derived from the
      # blue star of the Tamiya "Star Mark" logo (#1D95D3), darkened and
      # slightly desaturated so it never reads as BlueInfo (#1976D2) at a
      # glance — see STYLE_DECISIONS.md ADR-023.
      TamiyaPrimary: "#114B69"

      # Darker variant — used for hover states, borders on Tamiya-tinted
      # backgrounds, and depth shadows within primary-color zones.
      TamiyaDark: "#0B2F42"

      # Lighter variant — used for secondary text on white backgrounds when
      # primary-color tinting is needed, and for tinted UI elements.
      TamiyaLight: "#76ABC7"

      # Ultra-light variant — used for background tints, alternating panel fills,
      # and subtle zone delineation. Never use for text.
      TamiyaUltraLight: "#E8EFF2"

    neutral:
      # Page background. Mandatory for all page areas outside the primary-color panel.
      # This value must never be changed.
      White: "#FFFFFF"

      # Alternate background — used for table alternating rows and off-white zones.
      # Must not be used as the primary page background.
      OffWhite: "#F8F8F8"

      # Border color for dividers, table lines, and component outlines.
      LightGray: "#E8E8E8"

      # Secondary label color — placeholder text, inactive states, metadata.
      MidGray: "#9B9B9B"

      # Primary body text color. All body copy must use this value.
      DarkGray: "#4A4A4A"

      # Maximum contrast — used for headlines on white backgrounds.
      # Not for body text (use DarkGray).
      Black: "#1A1A1A"

    accent:
      # Gold accent — used for Tips boxes (C009), achievement badges,
      # and optional decorative highlights. Sparingly.
      GoldAccent: "#C8A838"

      # Light gold background — fill for Tips boxes. Pair with GoldAccent border.
      GoldLight: "#F5E9B8"

      # Tamiya accent — derived from the red star of the Tamiya "Star Mark" logo
      # (#EC2227), darkened and desaturated so it never reads as RedWarning
      # (#D32F2F) at a glance. Sparing decorative use only (e.g. cover kicker
      # underline) — never for warnings. See STYLE_DECISIONS.md ADR-023.
      TamiyaAccent: "#851E21"

      # Light Tamiya-accent background — pair with TamiyaAccent border.
      TamiyaAccentLight: "#EDDEDE"

    semantic:
      # Warning state — left-border color for C008 Warning components.
      # Never use for decoration.
      RedWarning: "#D32F2F"

      # Warning fill — background of C008 Warning boxes. Pair with RedWarning border.
      RedWarningLight: "#FFEBEE"

      # Success state — checkmarks, completion indicators, Final Checklist (P010).
      GreenSuccess: "#388E3C"

      # Success fill — background of success zones.
      GreenSuccessLight: "#E8F5E9"

      # Info state — general informational callouts not requiring primary-color branding.
      BlueInfo: "#1976D2"

      # Info fill — background of info callout boxes.
      BlueInfoLight: "#E3F2FD"

    panel:
      # Side panel background — the 4-column right panel in two-column layouts.
      # Must use TamiyaPrimary; do not use TamiyaDark or TamiyaLight here.
      PanelBackground: "#114B69"

      # Side panel border — visible only where the panel meets white content.
      PanelBorder: "#0B2F42"

    callout:
      # General callout background (C006) — informational boxes.
      CalloutBackground: "#E8EFF2"

      # General callout left-border (C006).
      CalloutBorder: "#76ABC7"

      # Warning callout accent (C008) — used as left-border and icon color.
      WarningColor: "#D32F2F"

      # Success callout accent — used for completed checklist items.
      SuccessColor: "#388E3C"

      # Annotation arrow color — used in C012 Zoom and C007 Exploded View.
      ArrowColor: "#114B69"

  # ============================================================
  # TYPOGRAPHY TOKENS
  # ============================================================
  # Font stacks follow CSS font-family syntax.
  # The first font in each stack is preferred; subsequent fonts are fallbacks.
  # Fallback selection rationale: see Assets/DesignSystem/Typography/README.md
  # ============================================================

  typography:

    fonts:
      # Display and heading font — condensed, high-impact, uppercase.
      # File: Assets/DesignSystem/Typography/Fonts/J_Audio_Cassette.otf (incorporato
      # via @font-face da Scripts/render_page.py — vedi CUSTOM_FONTS). Bebas Neue e
      # i fallback di sistema restano come rete di sicurezza se il file manca.
      TitleFont: "J Audio Cassette, Bebas Neue, Impact, Arial Black, sans-serif"

      # Body and UI text font — humanist sans, optimized for reading in small sizes.
      # Download: https://fonts.google.com/specimen/Source+Sans+Pro (OFL license)
      BodyFont: "Source Sans Pro, Open Sans, Helvetica Neue, sans-serif"

      # Monospaced font — for paint codes, part numbers, and technical identifiers.
      # Download: https://www.jetbrains.com/lp/mono/ (OFL license)
      MonoFont: "JetBrains Mono, Courier New, monospace"

    scale:
      # Display — model name on cover (P001), hero headings.
      DisplaySize: "48pt"
      DisplayLineHeight: "1.1"

      # H1 — page main title, section title on full-bleed pages.
      H1Size: "36pt"
      H1LineHeight: "1.2"

      # H2 — section headings within a page.
      H2Size: "28pt"
      H2LineHeight: "1.3"

      # H3 — subsection headings, component labels.
      H3Size: "22pt"
      H3LineHeight: "1.4"

      # H4 — callout titles, numbered step headers.
      H4Size: "16pt"
      H4LineHeight: "1.5"

      # Body — all paragraph text, list items, descriptions.
      BodySize: "11pt"
      BodyLineHeight: "1.6"

      # Caption — image captions, footnotes, source references.
      CaptionSize: "9pt"
      CaptionLineHeight: "1.5"

      # Label — component labels, page type tags, badge text (all uppercase).
      LabelSize: "8pt"
      LabelLineHeight: "1.4"

    # Compact representation of the full type scale for quick reference.
    # Format: Display/H1/H2/H3/H4/Body/Caption/Label (all in pt)
    FontScale: "48/36/28/22/16/11/9/8"

  # ============================================================
  # SPACING TOKENS
  # ============================================================
  # All spacing is based on a 4px base unit.
  # Use named tokens, not raw pixel values.
  # ============================================================

  spacing:
    # The atomic unit. All spacing values are multiples of this.
    SpacingBase: "4px"

    # Full scale in compact form: XS through XXXL
    SpacingScale: "4/8/12/16/24/32/48/64/96"

    # Named spacing steps for use in component specs
    XS: "4px"       # Inter-element micro-spacing
    S: "8px"        # Icon-to-label gaps, tight padding
    M: "12px"       # Internal component padding
    L: "16px"       # Standard section padding
    XL: "24px"      # Section-to-section gap
    XXL: "32px"     # Large block separation
    XXXL: "48px"    # Page-level zone separation

    # Page margin — horizontal margin on both sides
    PageMargin: "18mm"

    # Page margins per edge
    PageMarginTop: "15mm"
    PageMarginBottom: "20mm"

    # Grid column gap
    ColumnGap: "4mm"

    # Minimum padding around any render/image within its container
    ImagePadding: "8px"

  # ============================================================
  # SIZING TOKENS
  # ============================================================

  sizing:
    # C001 Header band height
    HeaderHeight: "18mm"

    # C002 Footer band height
    FooterHeight: "12mm"

    # Number of columns in the 12-column grid
    GridColumns: "12"

    # A4 page dimensions
    PageWidth: "210mm"
    PageHeight: "297mm"

    # US Letter page dimensions (alternate — set in PDF_CONFIG.yaml)
    # PageWidth: "216mm"
    # PageHeight: "279mm"

  # ============================================================
  # BORDER TOKENS
  # ============================================================

  borders:
    # Standard border radius for all components
    BorderRadius: "4px"

    # Standard border line thickness
    BorderThickness: "1px"

    # Accent border thickness (left-border on callouts, warnings, tips)
    BorderThickAccent: "4px"

    # Alias for BorderRadius — used in some component descriptions
    CornerRadius: "4px"

  # ============================================================
  # SHADOW TOKENS
  # ============================================================
  # Three shadow levels, following Material Design depth conventions.
  # Use Subtle for cards, Medium for floating elements, Strong for modals.
  # ============================================================

  shadows:
    # Cards, table rows, image frames
    ShadowSubtle: "0 1px 3px rgba(0,0,0,0.12)"

    # Callout boxes, side panels, component boundaries
    ShadowMedium: "0 4px 6px rgba(0,0,0,0.16)"

    # Cover render drop shadow, premium overlay panels
    ShadowStrong: "0 8px 16px rgba(0,0,0,0.20)"

    # Opacity value for shadow computation (informational — use full shadows above)
    ShadowOpacity: "0.16"

  # ============================================================
  # RENDER TOKENS
  # ============================================================
  # These tokens define the technical requirements for AI-generated renders.
  # See Core/RENDER_GUIDE.md for full specifications and lighting rig descriptions.
  # ============================================================

  render:
    # Default lighting rig for renders. Options: studio-neutral / drama / detail
    # See Core/RENDER_GUIDE.md §3 for rig specifications.
    RenderLighting: "studio-neutral"

    # Mandatory background color for all renders. Must be pure white.
    RenderBackground: "#FFFFFF"

    # Minimum padding between render edge and its container edge
    RenderPaddingMin: "8px"

    # Resolution requirements per page type
    CoverResolution: "2480x3508px"    # A4 at 300 DPI
    BodyResolution: "1240x1754px"     # A4 at 150 DPI (body pages)
    DetailResolution: "800x800px"     # Detail close-up renders
