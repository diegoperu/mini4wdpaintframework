# Page Manifest — P009
# SDK Version: 2.4.0
# CONDITIONAL: only generated when PROJECT.yaml premiumVariant.enabled = true

page_id: "P009"
conditional: true
condition: "PROJECT.yaml premiumVariant.enabled = true"

components:
  - id: "C001"
    name: "Header"
    required: true
    content_fields: ["title"]
  - id: "C002"
    name: "Footer"
    required: true
    content_fields: ["footer.page_id", "footer.model_name"]
  - id: "C006"
    name: "Callout Box"
    required: false
    content_fields: ["comparison_notes"]
  - id: "C008"
    name: "Warning Box"
    required: false
    content_fields: ["warnings"]
  - id: "C009"
    name: "Tip Box"
    required: false
    content_fields: ["tips"]
  - id: "C015"
    name: "Notes Panel"
    required: true
    content_fields: ["description"]

images:
  - role: "premium_comparison"
    description: "Vista comparativa affiancata: versione base vs. versione premium"
    file: ""
    resolution_required: "2480x3508"
    lighting: "studio-neutral"
    approved: false

tokens:
  - "VioletPrimary"
  - "White"
  - "DarkGray"
  - "TitleFont"
  - "BodyFont"
  - "HeaderHeight"
  - "FooterHeight"
  - "WarningColor"

prompt_file: "PromptEngine/PremiumVariant.md"
prompt_version: "2.4.0"
palette: []

fonts:
  - "TitleFont (Bebas Neue)"
  - "BodyFont (Source Sans Pro)"

dependencies:
  - "Assets/DesignSystem/Tokens/tokens.example.yaml"
  - "Config/LANGUAGE_POLICY.yaml"
  - "ApprovedAssets/Text/P002/content.yaml"
