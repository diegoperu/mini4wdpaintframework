renders:
  front:
    file: ""                 # REQUIRED
    alt: "Vista frontale"
  side:
    file: ""                 # REQUIRED
    alt: "Vista laterale destra"
  top:
    file: ""                 # REQUIRED
    alt: "Vista dall'alto"

component_mapping:
  C001:
    uses: ["title"]
  C002:
    uses: ["footer.page_id", "footer.model_name"]
