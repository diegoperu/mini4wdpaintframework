# ============================================================
# COLORS — one entry per paintScheme.colors[] in PROJECT.yaml
# ============================================================
colors:
  - id: ""                   # REQUIRED — matches PROJECT.yaml color id
    name: ""                 # REQUIRED — Italian descriptive name
    paint_code: ""           # REQUIRED — e.g. "TS-57"
    paint_brand: ""          # REQUIRED — e.g. "Tamiya"
    finish: ""               # REQUIRED — Lucido|Opaco|Satinato|Metallizzato|Perlato
    hex: ""                  # OPTIONAL — approximate hex
    area: ""                 # OPTIONAL — where applied on model
    notes: ""                # OPTIONAL

