# ============================================================
# CHECKLIST SECTIONS
# Items use Italian infinitive: "Verificare che..."
# ============================================================
checklist_sections:
  - title: "Verniciatura"    # REQUIRED
    items:
      - "Verificare che la carrozzeria sia completamente asciutta"
      - "Verificare l'uniformità del colore su tutta la superficie"
      - "Verificare l'assenza di colature o difetti"

  - title: "Mascheratura"
    items:
      - "Verificare che tutti i bordi di mascheratura siano netti"
      - "Verificare l'assenza di infiltrazioni di colore"

  - title: "Decalcomanie"
    items:
      - "Verificare che tutte le decalcomanie siano correttamente posizionate"
      - "Verificare l'assenza di bolle d'aria sotto le decalcomanie"
      - "Verificare che la vernice trasparente copra tutte le decalcomanie"

  - title: "Finitura"
    items:
      - "Verificare l'uniformità della vernice trasparente"
      - "Verificare che la finitura corrisponda allo schema previsto"

