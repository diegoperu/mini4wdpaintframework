  - "Core/TEXT_ENGINE.md — v2.5.0 output format row; Render Engine contract path"
  - "Core/PAGE_SYSTEM.md — module storage path"
  - "AI_ENTRYPOINT.md — Bootstrap Contract paths; CMS layer description"
  - "BOOTSTRAP.md — Phase 2a/3/7 paths; PROJECT.yaml path"
  - "Docs/LOAD_ORDER.md — Step 12 path"
  - "Docs/AI_BOOTSTRAP_PROMPT.md — Fase 1 split ChatGPT/Claude; Fase 2 colorId JOIN fix; Fase 4 path"
  - "FILE_MATRIX.md — new Projects/{M}/{V}/ section; ApprovedAssets/ marked deprecated"
  - "PROJECT_STRUCTURE.md — two-level structure; new mkdir commands"
  - "FIRST_PROJECT.md, FIRST_RENDER.md, FIRST_PDF.md — paths updated"
  - "OperatorGuide/01-07 — v2.5.0 header; path references updated"
  - "WHO_MODIFIES_WHAT.md, LIFECYCLE.md, WORKFLOW.md, OPERATOR_PROFILE.md — paths updated"
  - "START_HERE.md — PASSO 0 runtime selection; checklist updated to variant structure"
  - "Templates/ (all) — sdk_version bumped to 2.5.0"
  - "Projects/Proto_Emperor/Violet_Phantom/ — reference project migrated to v2.5.0"

compatibility:
