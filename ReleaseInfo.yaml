---
# ReleaseInfo.yaml
# Mini4WD Manual SDK — Release Metadata
# Updated at every release. See CHANGELOG.md for full history.

version: "2.5.5"
release_date: "2026-07-07"
release_type: "minor"
codename: "MultiProject"
release_name: "Deterministic Rendering & Runtime Consistency"

breaking_changes:
  - field: images_path
    old: "Projects/{ModelFolder}/{VariantFolder}/ApprovedImages/P{NNN}/ (pianificato in v2.5.0, mai implementato)"
    new: "Projects/{ModelFolder}/{VariantFolder}/Images/ — stessa cartella delle foto di riferimento, path esatto dichiarato da Scripts/render_page.py -> image_slots()"
    description: "Correzione di rotta rispetto al piano originale v2.5.0: l'implementazione reale (Scripts/render_page.py) non ha mai usato ApprovedImages/P{NNN}/ — usa Images/ direttamente. La documentazione ora riflette quello che esiste davvero."

migration_notes:
  from: "2.5.0"
  to: "2.5.5"
  guide: "CHANGELOG.md §[2.5.5]"
  summary: >
    Il rendering (Fase 4) non è più un singolo prompt whole-page verso un'AI
    generativa. Scripts/render_page.py genera testo/layout di ogni pagina
    direttamente da content.yaml (template Jinja2/HTML/CSS + Playwright/Chromium,
    zero AI coinvolta) — un'AI generativa serve solo per le illustrazioni isolate
    ancora mancanti (copertina, viste ortogonali, foto di dettaglio), generate una
    alla volta con i prompt già pronti in MISSING_IMAGES_PROMPT.md. Nessuna
    modifica allo schema di content.yaml/PROJECT.yaml — solo al meccanismo di
    generazione dell'illustrazione.
  required_actions:
    - "pip install -r Scripts/requirements.txt && playwright install chromium (una tantum)"
    - "Sostituire il vecchio flusso 'Prompt Fase 4 whole-page' con Scripts/render_page.py {Model} {Variant}"
    - "Le illustrazioni salvate vanno in Images/, non in un'ipotetica ApprovedImages/P{NNN}/ mai esistita"

new_in_this_version:
  - "Scripts/render_page.py — template deterministico (Jinja2 + Playwright) per testo/layout di ogni pagina, letto da content.yaml"
  - "Scripts/package_handoff.sh — pacchetto ridotto per generare solo illustrazioni isolate (non più pagine intere)"
  - "MISSING_IMAGES.md / MISSING_IMAGES_PROMPT.md / MISSING_IMAGES.json — generati per progetto, prompt pronti + formato machine-readable per un futuro nodo locale"
  - "Font custom incorporati via @font-face (J Audio Cassette, Bebas Neue, Source Sans Pro, JetBrains Mono) — Assets/DesignSystem/Typography/Fonts/"
  - "PDF unico per progetto via pdfunite (Scripts/render_page.py ... pdf)"
  - "Gemini ripristinato come runtime supportato, limitatamente alla Fase 4 (UAT-004) — UAT-002 restava valido per il vecchio scope whole-page"
  - "Docs/LOCAL_RENDER_NODE.md — evidenza e contratto input/output per un futuro nodo di generazione locale"

changed_in_this_version:
  - "Docs/AI_BOOTSTRAP_PROMPT.md — Fase 4 riscritta, fonte unica del prompt (4a template, 4b illustrazione, 4c nodo locale)"
  - "Docs/RENDER_HANDOFF_CONTEXT.md — ruolo riscritto da 'render pagina intera' a 'genera solo l'illustrazione'"
  - "OperatorGuide/Runtimes/Claude_Code.md, ChatGPT_Web.md — PASSO 10/12 riscritti sul nuovo flusso"
  - "FIRST_RENDER.md, FIRST_PDF.md — riscritti (erano ancora sul flusso whole-page pre-refactor)"
  - "OperatorGuide/01_Primo_Manuale.md, 02_Workflow.md, 05_Checklist.md — TAPPA/Fase 4-5 allineate"
  - "Documentation/OperationalManual/09_ApprovedAssets.md — riscritto per Projects/{Model}/{Variant}/ApprovedText/, ApprovedAssets/ (rimossa v2.5.0) non più descritta come struttura corrente"
  - "ROADMAP.md — stato Local AI Render Node aggiornato (meta' deterministica in uso in produzione)"

compatibility:
  backward_compatible_with: ["2.5.0"]
  breaking_from: "nessuno — content.yaml/PROJECT.yaml invariati, solo il meccanismo di rendering cambia"
  project_yaml_schema: "unchanged"
  page_ids: "P001–P010 unchanged"
  component_ids: "C001–C015 unchanged"
  token_names: "unchanged (TitleFont ora punta a J Audio Cassette con Bebas Neue come fallback reale, non solo nominale)"
  prompt_files: "PromptEngine/*.md invariati — riguarda solo Fase 4, non Fase 2/3"
  approved_text: "invariato — Projects/{Model}/{Variant}/ApprovedText/"

previous_releases:
  - version: "2.5.0"
    date: "2026-07-03"
    codename: "MultiProject"
    key: "Multi-Project Content Isolation — per-variant Projects/{Model}/{Variant}/ structure"
  - version: "2.4.1"
    date: "2026-07-02"
    codename: "Operator"
    key: "UX & Operator Workflow — START_HERE, OperatorGuide/, runtime-aware docs, UAT-001 fixes"
  - version: "2.4.0"
    date: "2026-07-01"
    codename: "CMS"
    key: "CMS layer (ApprovedAssets/), content.yaml as source of truth, page lifecycle"
  - version: "2.3.0"
    date: "2026-07-01"
    codename: "Editorial"
    key: "Text Engine, Italian-only language policy, LOAD sequence, editorial knowledge base"
  - version: "2.2.0"
    date: "2026-06-30"
    codename: "Pipeline"
    key: "Build pipeline, Config layer, Test suites, Knowledge base, AI Operating Rules"
  - version: "2.1.0"
