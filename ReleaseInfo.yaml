---
# ReleaseInfo.yaml
# Mini4WD Manual SDK — Release Metadata
# Updated at every release. See CHANGELOG.md for full history.

version: "2.5.0"
release_date: "2026-07-03"
release_type: "minor"
codename: "MultiProject"
release_name: "Multi-Project Content Isolation"

breaking_changes:
  - field: content_path
    old: "ApprovedAssets/Text/P{NNN}/content.yaml"
    new: "Projects/{ModelFolder}/{VariantFolder}/ApprovedText/P{NNN}/content.yaml"
  - field: images_path
    old: "ApprovedAssets/Images/P{NNN}/"
    new: "Projects/{ModelFolder}/{VariantFolder}/ApprovedImages/P{NNN}/"
  - field: index_path
    old: "ApprovedAssets/index.yaml"
    new: "Projects/{ModelFolder}/{VariantFolder}/index.yaml"
  - field: project_structure
    old: "Projects/{Model}/"
    new: "Projects/{Model}/{Variant}/"
  - field: paintScheme_slug
    status: "NEW REQUIRED FIELD"
    description: "paintScheme.slug (kebab-case) required in PROJECT.yaml from v2.5.0"

migration_notes:
  from: "2.4.1"
  to: "2.5.0"
  guide: "CHANGELOG.md §[2.5.0] Migration from v2.4.x"
  summary: >
    Per-project content isolation. ApprovedAssets/ (global shared directory) is
    deprecated and replaced by per-variant directories inside each project.
    Each project now lives at Projects/{Model}/{Variant}/ with its own
    ApprovedText/ and ApprovedImages/ subdirectories. No functional change to
    Prompt Engine, Text Engine, QA logic, or page/component specifications.
  required_actions:
    - "Add paintScheme.slug field to existing PROJECT.yaml files"
    - "Create Projects/{Model}/{Variant}/ subfolder for each project"
    - "Move PROJECT.yaml, Images/, Output/, Notes/ into the variant subfolder"
    - "Move ApprovedAssets/Text/ content to Projects/{Model}/{Variant}/ApprovedText/"

new_in_this_version:
  - "Projects/{Model}/{Variant}/ two-level project structure"
  - "paintScheme.slug field (REQUIRED) in Templates/PROJECT.yaml and Projects/PROJECT.yaml"
  - "ApprovedText/ and ApprovedImages/ per-variant directories"
  - "Core/NAMING_CONVENTION.md §3.1 — variant folder naming rule"
  - "Scripts/generate_prompts.py — pre-filled prompt generator (reads PROJECT.yaml, dynamic paths)"
  - "Docs/RUNTIMES.md — runtime concept, ChatGPT Web vs Claude Code comparison"
  - "OperatorGuide/Runtimes/ChatGPT_Web.md — standalone ChatGPT Web guide"
  - "OperatorGuide/Runtimes/Claude_Code.md — standalone Claude Code guide with handoff procedure"
  - "Documentation/QualityManagement/Reports/UR-0001.md — first user report"

changed_in_this_version:
